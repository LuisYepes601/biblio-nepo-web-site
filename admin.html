<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioNepo — Panel de Administración</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="./src/assets/styles/base/variables.css">
  <link rel="stylesheet" href="./src/assets/styles/base/global.css">
  <link rel="stylesheet" href="./src/features/admin/admin.css">
  <link rel="stylesheet" href="/src/features/autors/authors.css">
  <link rel="stylesheet" href="/src/features/books/books.css">
  <link rel="stylesheet" href="/src/features/categories/categories.css">
</head>
<body>

  <div class="app-layout">
    
    <div id="admin-sidebar-container"></div>

    <main class="main-content">
      
      <header class="top-header">
        <!-- Barra de búsqueda general eliminada -->
        <div class="header-actions" style="margin-left: auto;">
          <button class="icon-btn" title="Notificaciones">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-badge"></span>
          </button>
          <button class="icon-btn logout-btn" id="btnLogoutAdmin" title="Cerrar Sesión">
            <i class="fa-solid fa-power-off"></i>
          </button>
        </div>
      </header>

      <div id="admin-content-container" class="dashboard-body"></div>

    </main>
  </div>

<script type="module" src="./src/features/admin/admin.main.js"></script>
</body>
</html>
